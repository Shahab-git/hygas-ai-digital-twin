# Continuous Simulation Runtime -- scheduled workflow
# (docs/continuous_runtime_design.md, approved design, section 1).
#
# Runs scripts/run_continuous_cycle.py once per real hour, matching
# hb_wgs_psa_storage_chain.py's own ASSUMED_HOURS_PER_CYCLE = 1.0 exactly
# (see the design doc's own section 2 -- this cadence is not a free choice).
# GitHub does not guarantee scheduled workflows fire at exactly the top of
# the hour (occasional multi-minute delays, and rare skips, are documented
# GitHub behavior) -- immaterial for an hourly steady-state tick, stated
# here so it's never a surprise.
#
# Prerequisites (one-time, manual -- see the two schema files' own headers
# and the design doc's own section 7):
#   1. data/plant_state_current_schema.sql run in the Supabase SQL Editor.
#   2. data/plant_operator_setpoints_schema.sql run in the Supabase SQL
#      Editor (optional -- the driver script degrades gracefully without
#      it, but the setpoint mechanism won't be durable until it exists).
#   3. This repo's own Settings -> Secrets and variables -> Actions has
#      SUPABASE_URL and SUPABASE_KEY set to the SAME values already in
#      .streamlit/secrets.toml locally. Never committed to this file or
#      to the repo -- read only from GitHub's own encrypted secret store
#      at run time, below.
name: Continuous Simulation Cycle

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Supabase credentials to .streamlit/secrets.toml
        # vendor_log.py's own _get_secret() already has a non-Streamlit
        # fallback that reads exactly this file path for standalone
        # scripts -- confirmed directly against the current file before
        # writing this workflow, no code change needed to use it here.
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml << EOF
          SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
          SUPABASE_KEY = "${{ secrets.SUPABASE_KEY }}"
          EOF

      - name: Run one continuous simulation cycle
        run: python scripts/run_continuous_cycle.py
