# Continuous Simulation Runtime -- scheduled workflow
# (docs/continuous_runtime_design.md, approved design, section 1).
#
# Requests one run per hour (best-effort). AUDIT FIX B (docs/audit_2026-10-27.md,
# finding 1): the 2026-10-27 audit measured real gaps of 3-6 h (37 of 168
# hourly slots in 7 days) -- GitHub delays or drops scheduled runs, worst at
# the top of the hour, so the cron minute is now off-peak (:17). This does
# NOT guarantee hourly runs. The model no longer depends on them: the driver
# measures the real elapsed time and uses it as the cycle step
# (python/cycle_clock.py, docs/continuous_runtime_design.md).
#
# Prerequisites (one-time, manual -- see the two schema files' own headers
# and the design doc's own section 7):
#   1. data/plant_state_current_schema.sql run in the Supabase SQL Editor.
#   2. data/plant_operator_setpoints_schema.sql run in the Supabase SQL
#      Editor (optional -- the driver script degrades gracefully without
#      it, but the setpoint mechanism won't be durable until it exists).
#   3. (Audit fix E4) The runtime prefers a SUPABASE_SERVICE_KEY secret and falls
#      back to SUPABASE_KEY while it is not set -- data/migrations/004_tighten_rls.sql
#      removes anon write access and must only be run after that secret exists.
#   3b. This repo's own Settings -> Secrets and variables -> Actions has
#      SUPABASE_URL and SUPABASE_KEY set to the SAME values already in
#      .streamlit/secrets.toml locally. Never committed to this file or
#      to the repo -- read only from GitHub's own encrypted secret store
#      at run time, below.
name: Continuous Simulation Cycle

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

# Never run two cycles at once (each one rehydrates from, and then overwrites,
# the same store); a run that is already in progress is allowed to finish.
concurrency:
  group: continuous-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Log resolved versions of the requirements.txt packages
        # Read-only. Gives the real CI freeze in the run log, to compare
        # against requirements.lock.txt (which was resolved offline, not
        # taken from CI).
        run: pip freeze | grep -i -E "^(streamlit|numpy|supabase|pandas|altair|scipy)=="

      - name: Write Supabase credentials to .streamlit/secrets.toml
        # vendor_log.py's own _get_secret() already has a non-Streamlit
        # fallback that reads exactly this file path for standalone
        # scripts -- confirmed directly against the current file before
        # writing this workflow, no code change needed to use it here.
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml << EOF
          SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
          SUPABASE_KEY = "${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}"
          EOF

      - name: Run one continuous simulation cycle
        # The ONLY place that enables database writes (audit fix D): engine
        # runs everywhere else (app, self-tests, offline snapshots) never write.
        env:
          HYGAS_ALLOW_DB_WRITES: "1"
        run: python scripts/run_continuous_cycle.py
